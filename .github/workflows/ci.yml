name: CI

on:
  pull_request:
  push:
    branches: [main, stg, prod]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias .NET
        run: dotnet restore ./LosTresMosqueteros.slnx

      - name: Compilar backend
        run: dotnet build ./LosTresMosqueteros.slnx --configuration Release --no-restore

      - name: Ejecutar tests .NET
        run: dotnet test ./LosTresMosqueteros.slnx --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependencias Angular
        run: yarn install --frozen-lockfile

      - name: Compilar Angular
        run: yarn build

      - name: Ejecutar tests Angular
        run: yarn vitest run src/app/app.spec.ts